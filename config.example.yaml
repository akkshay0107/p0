# Copy this file to config.yaml for a machine-local configuration.
# Every setting is optional; the values below are the defaults.
# Relative paths start at the repository root.

# Shared by BC and PPO.
gamma: 0.99
seed: 0
# Mixed precision and torch.compile on CUDA; no effect on CPU.
enable_optim: true

ppo:
  # Holds ppo_checkpoint.pt, metrics.jsonl, TensorBoard files, and server logs.
  output_dir: artifacts/runs/ppo
  # Set at most one: continue a PPO run, or start a new run from policy weights.
  resume_checkpoint: null
  initial_policy_checkpoint: null
  num_episodes: 2000
  n_envs: 8
  rollout_steps: 320
  batch_size: 128
  lr: 0.0003
  entropy_coef: 0.01
  magnet_alpha: 0.03

bc:
  # The `p0-replays build-shards` output folder; the newest dataset in it is used.
  # Point it at one <dataset-uuid> folder to train on that dataset instead.
  dataset_dir: artifacts/datasets
  output_dir: artifacts/checkpoints/bc
  resume_checkpoint: null
  epochs: 1
  batch_decisions: 256
  learning_rate: 0.0003
  num_workers: 0

bot:
  username: Bot
  # Set both URLs to use a remote Showdown server; leave both null for localhost.
  websocket_url: null
  authentication_url: null
